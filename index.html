<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>West Texas Analytics</title>
<meta name="description" content="West Texas Analytics, LLC · San Angelo, Texas">
<meta name="theme-color" content="#24394A">
<link rel="canonical" href="https://westtexasanalytics.com/">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="West Texas Analytics">
<meta property="og:description" content="West Texas Analytics, LLC · San Angelo, Texas">
<meta property="og:url" content="https://westtexasanalytics.com/">
<meta property="og:image" content="https://westtexasanalytics.com/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Same palette and type as tools.westtexasanalytics.com */
  :root { --sky:#24394A; --ink:#1A2A37; --cream:#FFF6D8; --ground:#FDF4D9; --line:#E7DCC0; --sun:#D98A3D; --muted:#4A5560; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* One screen: the sunrise fills everything above the footer. */
  .page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
  header { position: relative; overflow: hidden; flex: 1 0 auto; min-height: 420px; display: flex; flex-direction: column;
    background: var(--sky); color: var(--cream); border-bottom: 3px solid var(--sun);
    padding: 28px clamp(20px, 6vw, 96px) 0; }
  header > *:not(svg) { position: relative; z-index: 1; }

  .top { display: flex; align-items: center; gap: 24px; }
  .mark { font-family: Bitter, Georgia, serif; font-weight: 700; font-size: 22px; color: var(--cream); text-decoration: none; letter-spacing: -0.01em; }
  .top nav { margin-left: auto; display: flex; gap: 22px; }
  .top nav a { color: var(--cream); text-decoration: none; font-weight: 500; font-size: 15px; opacity: .9; padding: 4px 0; border-bottom: 2px solid transparent; }
  .top nav a:hover, .top nav a[aria-current] { opacity: 1; border-bottom-color: var(--sun); }
  .top nav a:focus-visible, .mark:focus-visible, footer a:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

  /* Name sits in the upper-middle sky, well clear of the sun and buttes. */
  .title { margin: auto 0; padding-bottom: 22vh; text-align: center; }
  h1 { font-family: Bitter, Georgia, serif; font-weight: 700; font-size: clamp(25px, 5.4vw, 64px); line-height: 1.1; margin: 0 0 10px; letter-spacing: -0.02em; }
  .title p { margin: 0; font-size: clamp(16px, 1.8vw, 20px); opacity: .92; }
  h1, .title p { text-shadow: 0 1px 14px rgba(20, 28, 40, .4); }

  footer { background: var(--ground); padding: 24px clamp(20px, 6vw, 96px) 28px; display: flex; flex-wrap: wrap; gap: 10px 32px;
    justify-content: space-between; align-items: baseline; font-size: 15px; color: var(--muted); }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid #A8957A; }
  footer a:hover { border-bottom-color: var(--ink); }
  footer .sep { margin: 0 8px; color: #A8957A; }

  /* Sunrise over the Twin Buttes: night warms to dawn, stars fade, the sun rises in the saddle. Plays once (~9 s) and holds. */
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: visible; --dur: 9s; }
  .dawn  { opacity: 0; animation: fadeIn var(--dur) ease-in-out forwards; }
  .glow  { opacity: 0; animation: fadeIn var(--dur) cubic-bezier(.5,0,.3,1) forwards; }
  .stars { animation: fadeOut var(--dur) ease-in forwards; }
  .sunwrap { transform: translateY(78px); animation: rise var(--dur) cubic-bezier(.45,0,.25,1) forwards; }
  .buttes { fill: #1A2A37; animation: warm var(--dur) ease-in-out forwards; }
  .rim { opacity: 0; animation: fadeIn var(--dur) ease-in forwards; }
  @keyframes fadeIn  { 0%, 10% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: .12; } }
  @keyframes rise    { 0%, 25% { transform: translateY(78px); } 100% { transform: translateY(-14px); } }
  @keyframes warm    { 0%, 20% { fill: #1A2A37; } 100% { fill: #2B222D; } }
  @media (prefers-reduced-motion: reduce) { .dawn, .glow, .stars, .sunwrap, .buttes, .rim { animation-duration: 1ms; } }

  @media (max-width: 700px) {
    .top nav { gap: 16px; }
    .title { padding-bottom: 16vh; }
    footer { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <svg class="scene" viewBox="0 0 1280 500" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="dawnSky" x1="0" y1="-300" x2="0" y2="474" gradientUnits="userSpaceOnUse">
          <stop offset="0"   stop-color="#2A3E5A"/>
          <stop offset=".42" stop-color="#55567A"/>
          <stop offset=".70" stop-color="#B8786E"/>
          <stop offset=".87" stop-color="#EDA463"/>
          <stop offset="1"   stop-color="#F8D592"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="640" cy="474" r="560" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 474) scale(1.7 1) translate(-640 -474)">
          <stop offset="0"   stop-color="#FFE7B0" stop-opacity=".95"/>
          <stop offset=".25" stop-color="#FFC983" stop-opacity=".55"/>
          <stop offset="1"   stop-color="#FFB070" stop-opacity="0"/>
        </radialGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <!-- Sky and ground run far past the 1280 x 500 frame so any screen shape is filled. -->
      <rect x="-3000" y="-3000" width="7280" height="3600" fill="#24394A"/>
      <rect class="dawn" x="-3000" y="-3000" width="7280" height="3600" fill="url(#dawnSky)"/>
      <g class="stars" id="stars"></g>
      <rect class="glow" x="-3000" y="-3000" width="7280" height="3600" fill="url(#sunGlow)"/>
      <g class="sunwrap">
        <circle cx="640" cy="474" r="64" fill="#FFE2A0" opacity=".35" filter="url(#soft)"/>
        <circle cx="640" cy="474" r="44" fill="#FFF1CC"/>
      </g>
      <g transform="translate(0 360)">
        <path class="rim" d="M0 122 C80 121 140 118 180 112 C220 100 245 60 262 46 L272 40 L300 39 L330 38 L342 44 C365 62 400 92 450 104 C500 112 560 114 640 114 C720 114 800 112 850 104 C900 92 950 58 985 36 L995 30 L1030 29 L1065 28 L1078 34 C1100 50 1130 74 1170 90 C1200 100 1240 104 1280 108"
              fill="none" stroke="#FFC48A" stroke-width="3" filter="url(#soft)"/>
        <path class="buttes" d="M-3000 122 L0 122 C80 121 140 118 180 112 C220 100 245 60 262 46 L272 40 L300 39 L330 38 L342 44 C365 62 400 92 450 104 C500 112 560 114 640 114 C720 114 800 112 850 104 C900 92 950 58 985 36 L995 30 L1030 29 L1065 28 L1078 34 C1100 50 1130 74 1170 90 C1200 100 1240 104 1280 108 L4280 108 L4280 400 L-3000 400 Z"/>
      </g>
    </svg>

    <div class="top">
      <a class="mark" href="/" aria-label="West Texas Analytics home">WTA</a>
      <nav aria-label="Main">
        <a href="/" aria-current="page">Home</a>
        <a href="https://tools.westtexasanalytics.com/">Tools</a>
        <a href="mailto:kerry@wta.llc">Contact</a>
      </nav>
    </div>
    <div class="title">
      <h1>West Texas Analytics, LLC</h1>
      <p>San Angelo, Texas</p>
    </div>
  </header>
  <footer>
    <span><a href="mailto:kerry@wta.llc">kerry@wta.llc</a><span class="sep">·</span><a href="tel:+12812172216">281-217-2216</a></span>
    <span>www.WestTexasAnalytics.com</span>
  </footer>
</div>
<script>
  (function () {
    // Stars (warm white), spread over the whole sky including the extended area above the frame.
    let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    let out = "";
    for (let i = 0; i < 700; i++) {
      const y = 400 - Math.pow(rnd(), 0.75) * 2400, x = -1200 + rnd() * 3680;
      const r = 0.6 + Math.pow(rnd(), 3) * 1.3, a = 0.25 + Math.pow(rnd(), 2) * 0.7;
      out += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#F6F1E7" opacity="${a.toFixed(2)}"/>`;
    }
    document.getElementById("stars").innerHTML = out;
    // Phones: frame just the buttes so both stay in view and read at a good size.
    const svg = document.querySelector(".scene"), mq = matchMedia("(max-width: 700px)");
    const fit = () => svg.setAttribute("viewBox", mq.matches ? "200 0 880 500" : "0 0 1280 500");
    fit(); mq.addEventListener("change", fit);
  })();
</script>
</body>
</html>
